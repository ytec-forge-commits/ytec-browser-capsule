name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Windows x64 / Release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: ソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: .NET 10 SDKを準備
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: 依存関係を復元
        run: dotnet restore YtecBrowserCapsule.sln

      - name: Windows x64配布用ランタイムを復元
        run: >
          dotnet restore
          src/Ytec.BrowserCapsule.App/Ytec.BrowserCapsule.App.csproj
          --runtime win-x64

      - name: フォーマットを確認
        run: dotnet format YtecBrowserCapsule.sln --verify-no-changes --no-restore

      - name: NuGet脆弱性を確認
        run: >
          dotnet package list
          --project YtecBrowserCapsule.sln
          --vulnerable
          --include-transitive

      - name: 秘密情報を確認
        shell: pwsh
        run: ./eng/Test-Secrets.ps1 -IncludeGitHistory

      - name: Releaseビルド
        run: dotnet build YtecBrowserCapsule.sln --configuration Release --no-restore

      - name: Releaseテスト
        run: dotnet test YtecBrowserCapsule.sln --configuration Release --no-build

      - name: x64自己完結型ポータブルReleaseを作成
        shell: pwsh
        run: ./eng/New-PortableRelease.ps1 -Version 1.2.1

      - name: Release成果物を保存
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: YtecBrowserCapsule-1.2.1-win-x64
          path: |
            artifacts/YtecBrowserCapsule-1.2.1-win-x64
            artifacts/YtecBrowserCapsule-1.2.1-win-x64.zip
            artifacts/YtecBrowserCapsule-1.2.1-win-x64.zip.sha256
            artifacts/YtecBrowserCapsule-1.2.1-User-Manual-ja.pdf
            artifacts/YtecBrowserCapsule-1.2.1-User-Manual-en.pdf
          if-no-files-found: error
